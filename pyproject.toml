[project]
name = "fraud-detection"
version = "0.1.0"
description = "Mobile money fraud detection on PaySim with walk-forward validation and cost-sensitive metrics."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "silasyakalim", email = "yakalim15silas@gmail.com" }]
keywords = ["fraud-detection", "mobile-money", "machine-learning"]

dependencies = [
    # Data
    "polars>=1.18.0",
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Modeling
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    # Orchestration & tracking
    "mlflow>=2.18.0",
    "prefect>=3.1.0",
    # Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Utilities
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "kaggle>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "pre-commit>=4.0.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.scripts]
fraud-detect = "fraud_detection.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "PLR0913",  # too-many-arguments (we use kwargs heavily)
    "PLR2004",  # magic values (frequent in ML code)
    "E501",     # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "ARG"]
"notebooks/*" = ["E402", "F401", "F811"]
# Lazy imports inside Typer command bodies keep --help fast.
"src/fraud_detection/cli.py" = ["PLC0415"]
# sklearn convention: X is a feature matrix.
"src/fraud_detection/models/*.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------- pytest ----------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=fraud_detection",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring external services",
]

[tool.coverage.run]
source = ["src/fraud_detection"]
branch = true
omit = ["*/tests/*", "*/notebooks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
